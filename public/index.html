<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Task Board</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <div class="header-row">
        <h1>Agent Task Board</h1>
      </div>
      <div id="session-info" class="session-info"></div>

      <section id="alerts" class="alerts"></section>

      <section id="metrics" class="metrics"></section>

      <section id="settings-panel" class="settings-panel hidden">
        <div class="settings-panel-header">
          <h2>设置</h2>
          <button id="btn-close-settings">关闭</button>
        </div>

        <section class="alert-config" id="alert-config">
          <strong>告警阈值(分钟)</strong>
          <input id="rule-running" type="number" min="1" placeholder="running" />
          <input id="rule-blocked" type="number" min="1" placeholder="blocked" />
          <input id="rule-review" type="number" min="1" placeholder="review" />
          <button id="btn-save-rules">保存阈值</button>
        </section>

        <section class="alert-config" id="alert-channel-config">
          <strong>告警推送</strong>
          <input id="alert-webhook" placeholder="Webhook URL" />
          <label><input id="alert-enabled" type="checkbox" /> 启用</label>
          <button id="btn-test-alert-channel">测试推送</button>
          <button id="btn-save-alert-channel">保存推送配置</button>
          <div id="alert-channel-message" class="inline-message"></div>
        </section>
      </section>

      <section>
        <h2>任务看板</h2>
        <div id="kanban" class="kanban"></div>
      </section>

      <section>
        <h2>Agent</h2>
        <table id="agents-table">
          <thead>
            <tr>
              <th>Agent</th>
              <th>类型</th>
              <th>状态</th>
              <th>任务数</th>
              <th>完成</th>
              <th>失败</th>
              <th>成功率</th>
              <th>平均耗时(分)</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h2>定时任务</h2>
        <table id="cron-jobs-table">
          <thead>
            <tr>
              <th>Agent</th>
              <th>任务</th>
              <th>Cron</th>
              <th>执行URL</th>
              <th>下次执行</th>
              <th>最近执行</th>
              <th>最近状态</th>
              <th>成功</th>
              <th>失败</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h2>连接器健康</h2>
        <table id="connector-health-table">
          <thead>
            <tr>
              <th>连接器</th>
              <th>事件数</th>
              <th>最后事件</th>
              <th>延迟(分钟)</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>

      <section>
        <h2>审计日志</h2>
        <table id="audit-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>动作</th>
              <th>操作者</th>
              <th>任务</th>
              <th>详情</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
        <div id="audit-pagination" class="pager"></div>
      </section>
    </main>

    <aside id="drawer" class="drawer hidden"></aside>

    <script src="/app.js"></script>
  </body>
</html>
